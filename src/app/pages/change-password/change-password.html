<header class="topbar">
  <a class="brand-link" routerLink="/users" aria-label="Go to users">
    <img
      class="brand-logo"
      src="https://redefine.co.za/assets/images/logo.svg"
      alt="Redefine Properties">
  </a>

  <div class="account-menu">
    <button class="account-trigger" type="button" aria-haspopup="true">
      <span>{{ accountName }}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>
    <nav class = 'account-dropdown' aria-label = 'Account Options'>
        <button type = 'button' role  = 'menuitem'>Profile</button>
        <button type = 'button' role = 'menuitem' routerLink="/change-password">Change Password</button>
        <button type = 'button' role = 'menuitem' (click)="logout()">Logout</button>
    </nav>
  </div>
</header>

<main class="change-password-page">
  <h1>Change Password</h1>

  <form class="change-password-card" aria-label="Change password form" [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <div class="password-field">
      <label for="current-password">Current Password <span>*</span></label>
      <input
        id="current-password"
        [type]="showCurrentPassword ? 'text' : 'password'"
        placeholder="Enter Current Password"
        autocomplete="current-password" formControlName="currentPassword">

        <button type = 'button' class="password-toggle" (click)="showCurrentPassword = !showCurrentPassword">
            {{showCurrentPassword ? 'Hide' : 'Show'}}
        </button>
    </div>

    <div class="password-field">
      <label for="new-password">New Password <span>*</span></label>
      <input
        id="new-password"
        [type]="showNewPassword ? 'text' : 'password'"
        placeholder="Enter New Password"
        autocomplete="new-password" formControlName="newPassword">
    <button type = 'button' class="password-toggle" (click)="showNewPassword = !showNewPassword" >
            {{showNewPassword ? 'Hide' : 'Show'}}
        </button>
    </div>

    <div class="password-field">
      <label for="confirm-new-password">
        Confirm New Password <span>*</span>
      </label>
      <input
        id="confirm-new-password"
        [type]="showConfirmNewPassword ? 'text' : 'password'"
        placeholder="Confirm New Password"
        autocomplete="new-password" formControlName="confirmNewPassword">
        <button type = 'button' class="password-toggle" (click)="showConfirmNewPassword = !showConfirmNewPassword">
            {{showConfirmNewPassword ? 'Hide' : 'Show'}}
        </button>
    </div>

    @if(errorMessage)
    {
        <p class = 'error-message' role = 'alert'>{{errorMessage}}</p>
    }
    @if (successMessage) {
        <p class = 'success-message' role = 'status'>{{successMessage}}</p>
    }
    <div class="change-password-actions">
      <button type="button" routerLink="/users">Cancel</button>
      <button type="submit" [disabled]="passwordForm.invalid || isLoading">{{isLoading ? 'Updating...' : 'Update Password'}}</button>
    </div>
</form>
</main>
