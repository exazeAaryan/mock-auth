<div class="login-page">
  <div class="login-image">
    <img
      src="http://localhost:4200/assets/images/user-vector.svg"
      alt=""
      class="left-image"
    >
  </div>

  <div class="login-form-section">
    <div class="login-card">
      <a href="#">
        <img
          src="https://redefine.co.za/assets/images/logo.svg"
          class="brand-logo"
          alt="Redefine Properties"
        >
      </a>

      <h1>Forgot Password</h1>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">
            Email Address <span class="asterik">*</span>
          </label>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder=" &#9993; Email address"
          >

          @if (forgotForm.controls.email.touched &&
               forgotForm.controls.email.hasError('required')) {
            <small class="error">Email is required.</small>
          }

          @if (forgotForm.controls.email.touched &&
               forgotForm.controls.email.hasError('email')) {
            <small class="error">Enter a valid email address.</small>
          }
        </div>

        <div class="forgot-actions">
          <a routerLink="/login" class="back-to-login">← &nbsp; Back to Login</a>
          <button type="submit">Send Request</button>
        </div>
      </form>
    </div>
  </div>
</div>
